name: Thermal Core HUD (Windows .exe)

on:
  push:
    paths:
      - "thermal-monitor/**"
      - ".github/workflows/thermal-core-hud.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: thermal-monitor
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: HWiNFO reader on real Windows (no HWiNFO installed -> clean "not found")
        run: |
          python -c "import hwinfo; exec('try:\n hwinfo.read_shared_memory(); print(\'unexpected: HWiNFO present\')\nexcept hwinfo.HwinfoUnavailable as e:\n print(\'OK:\', e)')"

      - name: Install PyInstaller (bootloader compiled from source)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          # Tự biên dịch bootloader (MSVC có sẵn trên runner) để giảm cảnh báo nhầm của phần mềm diệt virus;
          # nếu biên dịch lỗi thì dùng bootloader dựng sẵn.
          python -m pip install --upgrade pip wheel
          python -m pip install -v --no-cache-dir --no-binary pyinstaller "pyinstaller==6.11.1" 2>&1 |
            Select-String -Pattern 'bootloader|waf|cl\.exe|error' | Select-Object -Last 15
          if ($LASTEXITCODE -ne 0 -or -not (python -m PyInstaller --version)) {
            Write-Host "::warning::Bootloader compile failed - using prebuilt PyInstaller"
            python -m pip install --force-reinstall "pyinstaller==6.11.1"
          }
          $boot = python -c "import PyInstaller, os; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel', 'runw.exe'))"
          Write-Host "Bootloader: $boot"
          (Get-Item $boot).LastWriteTime

      - name: Build ThermalCoreHUD.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name ThermalCoreHUD --icon assets/icon.ico --version-file version_info.txt
          --add-data "web;web" app.py

      - name: Smoke test - demo mode
        run: |
          $p = Start-Process dist/ThermalCoreHUD.exe -ArgumentList '--demo','--ui','none','--port','8790' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $s = Invoke-RestMethod http://127.0.0.1:8790/api/snapshot; $ok = $s.mode -eq 'demo' -and $s.sensors.Count -gt 0 } catch {}
          }
          $html = (Invoke-WebRequest http://127.0.0.1:8790/ -UseBasicParsing).Content
          taskkill /PID $p.Id /T /F | Out-Null   # exe một file = 2 tiến trình (bootloader + app)
          if (-not $ok -or $html -notmatch 'THERMAL') { throw 'Demo smoke test failed' }
          Write-Host "Demo OK: $($s.sensors.Count) sensors, version $($s.version)"

      - name: Smoke test - overlay window (screenshot)
        run: |
          $p = Start-Process dist/ThermalCoreHUD.exe -ArgumentList '--demo','--overlay','--port','8792' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $s = Invoke-RestMethod http://127.0.0.1:8792/api/snapshot; $ok = $s.overlay -eq $true } catch {}
          }
          Start-Sleep 3
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/dist/overlay-screenshot.png")
            Write-Host "Screenshot $($b.Width)x$($b.Height)"
          } catch { Write-Host "::warning::Screenshot failed: $_" }
          $ov = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8792/api/overlay -Headers @{ 'X-TCH' = '1' } `
            -ContentType 'application/json' -Body '{"action":"hide"}'
          Start-Sleep 2
          $hidden = (Invoke-RestMethod http://127.0.0.1:8792/api/snapshot).overlay -eq $false
          taskkill /PID $p.Id /T /F | Out-Null
          if (-not $ok) { throw 'Overlay did not start' }
          if (-not $hidden) { throw 'Overlay did not hide' }
          Write-Host 'Overlay OK (show + hide)'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-screenshot
          path: thermal-monitor/dist/overlay-screenshot.png
          if-no-files-found: ignore

      - name: Smoke test - real mode (auto-download LibreHardwareMonitor)
        run: |
          $p = Start-Process dist/ThermalCoreHUD.exe -ArgumentList '--ui','none','--port','8791' -PassThru
          $lhm = Join-Path $env:LOCALAPPDATA 'ThermalCoreHUD/lhm'
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 1
            $ok = (Test-Path "$lhm/LibreHardwareMonitor.exe") -and (Test-Path "$lhm/LibreHardwareMonitor.config")
          }
          # Máy build không có người bấm hộp thoại cài PawnIO của LHM, nên LHM có thể không trả dữ liệu:
          # chỉ ghi log, không coi là lỗi.
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 1
            try { $s = Invoke-RestMethod http://127.0.0.1:8791/api/snapshot; if ($s.sensors.Count -gt 0) { break } } catch {}
          }
          Write-Host "Source: $($s.source) | mode: $($s.mode) | sensors: $($s.sensors.Count)"
          $s.messages | ForEach-Object { Write-Host "  ! $_" }
          $s.sensors | ForEach-Object { Write-Host "  - [$($_.category)] $($_.name) = $($_.value) ($($_.hardware))" }
          Get-Content "$lhm/LibreHardwareMonitor.config"
          taskkill /PID $p.Id /T /F | Out-Null
          Get-Process LibreHardwareMonitor -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw 'LibreHardwareMonitor was not installed/configured' }

      - name: Checksum
        id: meta
        run: |
          $hash = (Get-FileHash dist/ThermalCoreHUD.exe -Algorithm SHA256).Hash
          $ver = (Select-String -Path app.py -Pattern 'APP_VERSION = "(.+?)"').Matches[0].Groups[1].Value
          "$hash  ThermalCoreHUD.exe" | Out-File dist/ThermalCoreHUD.exe.sha256 -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "v$ver SHA256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: ThermalCoreHUD-${{ steps.meta.outputs.version }}
          path: |
            thermal-monitor/dist/ThermalCoreHUD.exe
            thermal-monitor/dist/ThermalCoreHUD.exe.sha256

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "thermal-core-hud-v${{ steps.meta.outputs.version }}-b${{ github.run_number }}"
          $notes = @"
          Thermal Core HUD v${{ steps.meta.outputs.version }} (build ${{ github.run_number }}, commit ${{ github.sha }})

          Tải ThermalCoreHUD.exe, nhấp đúp, bấm Yes ở hộp thoại quyền Administrator.
          Lần đầu chạy app tự tải LibreHardwareMonitor v0.9.6 (có kiểm tra SHA256).

          SHA256: ${{ steps.meta.outputs.sha256 }}
          "@
          $assets = @('dist/ThermalCoreHUD.exe', 'dist/ThermalCoreHUD.exe.sha256')
          if (Test-Path dist/overlay-screenshot.png) { $assets += 'dist/overlay-screenshot.png#Overlay preview (build machine)' }
          gh release create $tag @assets `
            --target "${{ github.sha }}" --title "Thermal Core HUD v${{ steps.meta.outputs.version }} (build ${{ github.run_number }})" `
            --notes $notes --latest
