<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thermal Core HUD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322e5ff' stroke-width='3'/%3E%3Cpath d='M16 16 L24 9' stroke='%23ff4d2e' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="fx-grid" aria-hidden="true"></div>
  <div class="fx-scan" aria-hidden="true"></div>
  <div class="fx-vignette" aria-hidden="true"></div>

  <header class="hud-top">
    <div class="brand">
      <svg viewBox="0 0 48 48" class="logo" aria-hidden="true">
        <polygon points="24,2 44,13 44,35 24,46 4,35 4,13" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="24" cy="24" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3" />
        <line x1="24" y1="24" x2="31" y2="17" stroke="#ff4d2e" stroke-width="3" stroke-linecap="round" />
      </svg>
      <div>
        <h1>THERMAL<span>CORE</span></h1>
        <small>REALTIME HARDWARE TEMPERATURE HUD</small>
      </div>
    </div>

    <div class="telemetry">
      <div class="pill" id="linkPill" data-state="wait"><i></i><span>CONNECTING</span></div>
      <div class="tm"><label>SOURCE</label><b id="source">—</b></div>
      <div class="tm"><label>SYSTEM</label><b id="sysState">—</b></div>
      <div class="tm"><label>SAMPLE</label><b id="rate">—</b></div>
    </div>

    <div class="right">
      <div class="clock"><b id="clock">--:--:--</b><small id="date">----</small></div>
      <div class="controls">
        <button id="btnUnit" title="Đổi đơn vị °C / °F">°C</button>
        <button id="btnSound" title="Bật/tắt còi cảnh báo khi quá nhiệt">ALARM OFF</button>
        <button id="btnOverlay" disabled>OVERLAY</button>
        <button id="btnSettings" title="Chỉnh ngưỡng cảnh báo">CALIBRATE</button>
        <button id="btnFull" title="Toàn màn hình">⛶</button>
      </div>
    </div>
  </header>

  <div id="alertBar" class="alert-bar" hidden></div>
  <div id="msgBar" class="msg-bar" hidden></div>

  <main class="gauges" id="gauges"></main>

  <section class="bank">
    <div class="bank-head">
      <h2><span>//</span> SENSOR ARRAY</h2>
      <small id="bankCount">0 sensors</small>
    </div>
    <div id="bank" class="bank-grid"></div>
  </section>

  <footer class="hud-foot">
    <span>THERMAL CORE HUD v1.0</span>
    <span id="footInfo">Chỉ chạy trên máy này (127.0.0.1) · không gửi dữ liệu ra ngoài</span>
  </footer>

  <dialog id="settings" class="settings">
    <form method="dialog">
      <h3><span>//</span> CALIBRATION</h3>
      <p>Ngưỡng cảnh báo theo °C. Vượt ngưỡng <b class="amber">WARN</b> thẻ chuyển cam, vượt <b class="red">CRIT</b> báo động đỏ.</p>
      <div id="settingsRows" class="settings-rows"></div>
      <div class="settings-actions">
        <button type="button" id="btnReset">MẶC ĐỊNH</button>
        <button type="submit" value="save" class="primary">LƯU</button>
      </div>
    </form>
  </dialog>

  <template id="tplGauge">
    <section class="card">
      <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
      <header class="card-head">
        <div class="ttl"><span class="code"></span><h2></h2></div>
        <select class="pick" title="Chọn cảm biến hiển thị"></select>
      </header>
      <div class="dial-wrap"><canvas class="dial"></canvas></div>
      <div class="stats">
        <div><label>MIN</label><b class="s-min">--</b></div>
        <div><label>AVG</label><b class="s-avg">--</b></div>
        <div><label>MAX</label><b class="s-max">--</b></div>
        <div><label>Δ 10s</label><b class="s-trend">--</b></div>
      </div>
      <canvas class="spark"></canvas>
      <div class="card-foot"><span class="hw">—</span><span class="state">STANDBY</span></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
